name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        # Keep CI focused on correctness while the legacy style debt is cleaned up
        # incrementally. These rules catch syntax errors and undefined names.
        run: ruff check src tests app.py streamlit_app.py --select E9,F63,F7,F82
      - name: Test
        run: pytest -q
